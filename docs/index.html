<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>樓層用電紀錄</title>
  <style>
:root{font-family:"Inter","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;color:#102c24;background:#f0f4ef;font-synthesis:none;--ink:#102c24;--muted:#536963;--line:#d9e4dc;--green:#17664f;--white:#fff}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
button,input,select{font:inherit}
a{color:inherit;text-decoration:none}
.shell{width:min(1216px,calc(100% - 48px));margin-inline:auto}
.top{background:#10392e;color:#fff}
.bar,.section-heading,.heading,.account,.filters,.actions{display:flex;align-items:center;gap:14px}
.bar{min-height:72px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:.04em}
.brand span{display:grid;place-items:center;background:#a8e4b9;color:#133f31;border-radius:10px;width:36px;height:36px;font-size:23px}
.account{font-size:.85rem}
.top button{color:#fff;border-color:#577b70;background:transparent}
main{padding-block:32px 60px}
h1,h2,p{margin:0}
h1{font-size:clamp(1.9rem,4vw,2.8rem);letter-spacing:-.045em}
h2{font-size:1.12rem}
.heading p,.hint,.metric small,.summary small{color:var(--muted)}
.heading p{margin-top:7px;font-size:.95rem}
.heading{justify-content:space-between;flex-wrap:wrap}
.card{background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:0 3px 12px #17361d08}
.auth{max-width:470px;margin:clamp(16px,8vh,88px) auto;padding:28px}
.auth h1{font-size:1.65rem;margin-bottom:18px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}
.metric{padding:18px 20px;border-top:4px solid #4b8c75}
.metric.floor2{border-top-color:#9bb34e}
.metric.floor3{border-top-color:#43949d}
.metric span,.metric small{display:block}
.metric span{font-size:.88rem;color:var(--muted)}
.metric strong{display:block;margin:3px 0;font-size:clamp(1.55rem,4vw,2.2rem);font-variant-numeric:tabular-nums}
.metric small{font-size:.77rem}
.workspace{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:16px;align-items:start}
.entry,.trend,.history{padding:22px}
.section-heading{justify-content:space-between;flex-wrap:wrap}
.segments{display:inline-flex;background:#eaf1eb;border-radius:10px;padding:3px}
button{cursor:pointer;border-radius:8px;border:1px solid transparent;font-weight:700;padding:9px 13px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #569b76;outline-offset:2px}
button:disabled{opacity:.55;cursor:wait}
.segments button{padding:6px 12px;background:transparent;color:var(--muted)}
.segments button[aria-pressed=true]{background:#fff;color:var(--ink);border-color:var(--line)}
.primary{color:#fff;background:var(--green)}
.primary:hover{background:#10513e}
.quiet{color:var(--green);background:#fff;border-color:var(--line)}
label{display:grid;gap:6px;font-size:.84rem;font-weight:650}
input,select{min-width:0;width:100%;padding:8px 9px;border:1px solid #c7d6cc;border-radius:8px;background:#fff;color:var(--ink)}
.filters{align-items:end;margin-top:16px}
form{display:grid;gap:13px;margin-top:14px}
form > button{justify-self:start}
.entry-values{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
.hint,[role=status],[role=alert]{font-size:.84rem;line-height:1.55;overflow-wrap:anywhere}
[role=status]:empty,[role=alert]:empty{display:none}
details{border-top:1px solid var(--line);margin-top:18px;padding-top:15px;font-size:.9rem}
summary{cursor:pointer;font-weight:700}
.summary{display:flex;align-items:baseline;gap:8px;margin-top:14px;color:var(--green)}
.summary strong{font-size:2rem;line-height:1.15}
.summary small{margin-left:auto}
.chart{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:16px 0}
.trend-graphic{overflow-x:auto}
.trend-graphic canvas{width:100%;min-width:420px;display:block}
.trend-legend,.trend-key{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.trend-legend{gap:8px 12px;font-size:.76rem;color:var(--muted)}
.trend-key i{height:11px;width:11px;border:1px solid #53746a;border-radius:2px}
.trend-data{margin-top:2px;padding-top:9px}
.trend-data .table-wrap{margin-top:8px;max-height:270px}
.empty{padding:18px;color:var(--muted);background:#f6f9f5;border-radius:8px;font-size:.9rem}
.history{margin-top:16px}
.history .hint{margin:12px 0}
.table-wrap{overflow:auto;max-height:500px}
table{width:100%;border-collapse:collapse;text-align:left;font-variant-numeric:tabular-nums;font-size:.9rem;white-space:nowrap}
thead{position:sticky;top:0;background:#ecf3ed}
th,td{padding:10px;border-bottom:1px solid var(--line)}
td small{display:block;color:var(--muted);margin-top:3px}
td button{padding:5px 9px}
.error{color:#a03026!important}
#offline{margin-top:13px}
@media(max-width:780px){.workspace{grid-template-columns:1fr}.entry{grid-row:1}}
@media(max-width:490px){.shell{width:calc(100% - 24px)}.account{gap:5px;font-size:.72rem}.brand{letter-spacing:0;font-size:.88rem}.metrics{gap:6px}.metric{padding:10px 7px}.metric span,.metric small{font-size:.68rem}.entry,.trend,.history{padding:15px}main{padding-top:22px}}

.usage-24{padding:16px;margin:14px 0}
.usage-24 h2{font-size:1rem;margin:0 0 4px}
.usage-24-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.usage-24-metric{min-width:0;display:grid;gap:4px;padding:10px;border-radius:10px;background:#edf6f0}
.usage-24-metric strong{font-size:1.1rem}
.usage-24-metric small{color:#466457}
@media(max-width:520px){.usage-24-grid{grid-template-columns:repeat(2,1fr)}}
  </style>
  <script type="module" src="./app.mjs?v=usage24"></script>
</head>
<body>
  <header class="top"><div class="shell bar">
    <a class="brand" href="./" aria-label="樓層用電紀錄首頁"><span aria-hidden="true">ϟ</span> 樓層用電紀錄</a>
    <div class="account"><span id="mode"></span><button id="logout" class="quiet" hidden>登出</button></div>
  </div></header>
  <main class="shell">
    <section id="login-panel" class="card auth">
      <h1>登入家庭用電紀錄</h1>
      <form id="login">
        <button class="primary" disabled>使用 Google 登入</button>
      </form>
      <p id="login-message" role="status"></p>
      <button id="offline" class="quiet" hidden>使用離線模式</button>
    </section>
    <div id="dashboard" hidden>
      <div class="heading"><div><h1>用電總覽</h1><p id="coverage">讀取抄表紀錄中</p></div><button type="button" id="export-excel" class="quiet" disabled>匯出 Excel</button></div>
      <section class="metrics" id="metrics" aria-label="各樓層最新讀數"></section>
      <section class="card usage-24" aria-labelledby="usage-24-title">
        <h2 id="usage-24-title">近 24 小時用電</h2>
        <p class="hint" id="usage-24-period"></p>
        <div id="usage-24-metrics" class="usage-24-grid"></div>
        <p class="hint">以最新抄表時間往前推 24 小時。起點落在兩次抄表之間時，若間隔在 48 小時內，按時間比例估算。</p>
      </section>
      <div class="workspace">
        <section class="card trend">
          <div class="section-heading"><h2>歷史用電趨勢</h2><div id="periods" class="segments" aria-label="趨勢週期">
            <button type="button" data-period="day" aria-pressed="true">日</button>
            <button type="button" data-period="month" aria-pressed="false">月</button>
            <button type="button" data-period="year" aria-pressed="false">年</button>
          </div></div>
          <div class="filters">
            <label>樓層<select id="floor"><option value="total">全樓合計</option><option value="floor1">1 樓</option><option value="floor2">2 樓</option><option value="floor3">3 樓</option></select></label>
            <label id="month-field">月份<input id="month" type="month"></label>
            <label id="year-field" hidden>年份<select id="year"></select></label>
          </div>
          <div class="summary"><strong id="sum">—</strong><span>度</span><small id="summary-label"></small></div>
          <div id="chart" class="chart"></div>
          <p id="chart-note" class="hint"></p>
        </section>
        <section class="card entry">
          <h2 id="entry-title">新增抄表</h2>
          <form id="reading">
            <label>抄表日期與時間（臺灣）<input name="recorded_at" type="datetime-local" required></label>
            <div class="entry-values">
              <label>1 樓<input name="floor1" type="number" min="0" max="9999999999.99" step="0.01" inputmode="decimal"></label>
              <label>2 樓<input name="floor2" type="number" min="0" max="9999999999.99" step="0.01" inputmode="decimal"></label>
              <label>3 樓<input name="floor3" type="number" min="0" max="9999999999.99" step="0.01" inputmode="decimal"></label>
            </div>
            <p id="estimate" class="hint">填寫至少一個樓層的累計電表讀數。</p>
            <div class="actions"><button id="save-reading" class="primary">儲存讀數</button><button type="button" id="cancel-edit" class="quiet" hidden>取消編輯</button></div>
            <p id="save-message" role="status"></p>
          </form>
          <details id="import-panel"><summary>匯入歷史紀錄</summary><form id="import">
            <label>選擇歷史 CSV<input name="file" type="file" accept=".csv,text/csv" required></label>
            <p class="hint">相同抄表時間的既有紀錄會保留。</p>
            <button class="quiet">匯入 CSV</button>
            <p id="import-message" role="status"></p>
          </form></details>
        </section>
      </div>
      <section class="card history">
        <div class="section-heading"><h2>抄表明細</h2><label>顯示範圍<select id="history-filter"><option value="latest">最近 30 筆</option><option value="anomaly">讀數下降</option><option value="all">全部紀錄</option></select></label></div>
        <p class="hint">括號內為與該樓層上次有效抄表的差值。讀數下降的區間不計入趨勢。</p>
        <div class="table-wrap"><table><thead><tr><th scope="col">抄表時間</th><th scope="col">1 樓</th><th scope="col">2 樓</th><th scope="col">3 樓</th><th id="history-actions" scope="col">操作</th></tr></thead><tbody id="history"></tbody></table></div>
      </section>
      <p id="page-error" role="alert"></p>
    </div>
  </main>
</body>
</html>
